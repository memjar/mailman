name: Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [1.89, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy,rustfmt
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: No third-party git sources (AXE mirrors only)
        run: |
          status=0
          # A fetch target looks like: git = "https://github.com/<owner>/<repo>".
          # The [patch."https://github.com/pimalaya/..."] table headers are not
          # fetch targets — they name the source being redirected — so they stay.
          if grep -nE 'git *= *"https://github\.(com|localhost)/(pimalaya|soywod)/' Cargo.toml; then
            echo "::error::Cargo.toml fetches a dependency from a third-party repository; mirror it under memjar (docs/DEPENDENCIES.md)"
            status=1
          fi
          if grep -nE 'git\+https://github\.com/(pimalaya|soywod)/' Cargo.lock; then
            echo "::error::Cargo.lock resolved a dependency from a third-party repository"
            status=1
          fi
          if [ "$status" = 0 ]; then echo "every git dependency resolves to github.com/memjar"; fi
          exit $status
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Format
        run: cargo fmt --check
